version: '3'

# Local development entry points. Mirrors .vscode/launch.json.
# Prerequisites: `cp .env.example .env` (LLM keys), `docker compose up -d pgvector`,
# `cd frontend && bun install`.

tasks:
  dev:backend:
    desc: Start Go backend on http://localhost:8080 (reads ./.env)
    dir: '{{.ROOT_DIR}}'
    env:
      CORS_ORIGINS: 'http://localhost:*,https://localhost:*'
      SERVER_PORT: '8080'
      SERVER_USE_SSL: 'false'
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/pentagidb?sslmode=disable'
      PUBLIC_URL: 'http://localhost:8080'
      STATIC_URL: 'http://localhost:8000'
    cmds:
      # go.mod lives in backend/; build there, run from repo root so ./.env is loaded.
      - go build -C backend -trimpath -o ../build/peepie-dev ./cmd/pentagi
      - ./build/peepie-dev

  dev:web:
    desc: Start Vite frontend on http://localhost:8000 (proxies API to localhost:8080)
    dir: '{{.ROOT_DIR}}/frontend'
    env:
      VITE_APP_LOG_LEVEL: DEBUG
      VITE_API_URL: 'localhost:8080'
      VITE_USE_HTTPS: 'false'
      VITE_PORT: '8000'
      VITE_HOST: '0.0.0.0'
    cmds:
      - bun run dev

  build:web:
    desc: Build the frontend SPA into frontend/dist
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - bun run build

  build:embed:
    desc: Build the frontend and stage it for go:embed in backend/pkg/server/webui/dist
    dir: '{{.ROOT_DIR}}'
    deps: [build:web]
    cmds:
      # go:embed cannot reach outside the module, so stage dist inside backend/.
      - find backend/pkg/server/webui/dist -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
      - cp -R frontend/dist/. backend/pkg/server/webui/dist/

  build:go:
    internal: true
    dir: '{{.ROOT_DIR}}'
    env:
      # Pure-Go static binary, same as the Docker image; required for cross-compiling.
      CGO_ENABLED: '0'
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
      - go build -C backend -trimpath -o '../build/{{.OUTPUT}}' ./cmd/pentagi

  build:
    desc: Build build/peepie for the host platform with the frontend embedded
    deps: [build:embed]
    cmds:
      - task: build:go
        vars:
          GOOS: '{{OS}}'
          GOARCH: '{{ARCH}}'
          OUTPUT: 'peepie{{exeExt}}'

  build:linux:
    desc: Cross-compile build/peepie-linux-<ARCH> (ARCH=amd64 default, e.g. `task build:linux ARCH=arm64`)
    deps: [build:embed]
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    cmds:
      - task: build:go
        vars:
          GOOS: linux
          GOARCH: '{{.ARCH}}'
          OUTPUT: 'peepie-linux-{{.ARCH}}'

  build:windows:
    desc: Cross-compile build/peepie-windows-<ARCH>.exe (ARCH=amd64 default, e.g. `task build:windows ARCH=arm64`)
    deps: [build:embed]
    vars:
      ARCH: '{{.ARCH | default "amd64"}}'
    cmds:
      - task: build:go
        vars:
          GOOS: windows
          GOARCH: '{{.ARCH}}'
          OUTPUT: 'peepie-windows-{{.ARCH}}.exe'
